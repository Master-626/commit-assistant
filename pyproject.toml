[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "commit-assistant"
version = "1.1.0"
authors = [
    { name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }
]
description = "A lightweight CLI tool that generates conventional commit messages based on your staged changes."
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Version Control :: Git",
]
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Master-626/commit-assistant"
Repository = "https://github.com/Master-626/commit-assistant"
Issues = "https://github.com/Master-626/commit-assistant/issues"

[project.scripts]
commit-assist = "commit_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["commit_assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
