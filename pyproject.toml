[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "commit-assistant"
version = "1.0.0"
authors = [
    { name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }
]
description = "A lightweight CLI tool that generates conventional commit messages based on your staged changes."
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Version Control :: Git",
]
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
]

[project.urls]
Homepage = "https://github.com/Master-626/commit-assistant"
Repository = "https://github.com/Master-626/commit-assistant"
Issues = "https://github.com/Master-626/commit-assistant/issues"

[project.scripts]
commit-assist = "commit_assistant.cli:main"
